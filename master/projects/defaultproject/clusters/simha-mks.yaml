apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: simha-mks
  project: defaultproject
spec:
  blueprint:
    name: opa
    version: v1
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.35.0
    network:
      cni:
        name: Calico
        version: 3.28.1
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: simha-mks
      operatingSystem: Ubuntu24.04
      privateIP: 10.1.0.253
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.2.0
  proxy: {}
  type: mks
